version: '3.4'

services:
  catalogdb:
    image: postgres:15
  basketdb:
    image: postgres:15
  distributedcache:
    image: redis

  basket.api:
    image: ${DOCKER_REGISTRY-}basketapi
    build:
      context: .
      dockerfile: Services/Basket/Basket.API/Dockerfile

volumes:
  postgres_catalog:
  postgres_basket: