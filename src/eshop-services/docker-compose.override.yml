version: '3.4'

services:
  catalogdb:
    container_name: catalogdb
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: CatalogDb
    restart: always
    ports:
      - "5433:5432"
    volumes:
      - postgres_catalog:/var/lib/postgresql/data/
  

  catalog.api:
    container_name: catalog.api
    build:
      context: .
      dockerfile: Services/Catalog/Catolog.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__CatalogDb: Host=catalogdb;Port=5432;Database=CatalogDb;Username=postgres;Password=postgres
    ports:
      - "8080:8080"
    depends_on:
      - catalogdb

  basket.api:
    container_name: basket.api
    build:
      context: .
      dockerfile: Services/Basket/Basket.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Redis: distributedcache:6379
    ports:
      - "18081:8080"
    depends_on:
      - distributedcache

  order.api:
    container_name: order.api
    build:
      context: .
      dockerfile: Services/Order/Order.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # La cadena de conexión de MongoDB Atlas NUNCA se escribe aquí: se toma de una
      # variable de entorno del host (definida en un .env local, fuera del control de versiones).
      MongoDb__ConnectionString: ${MONGODB_CONNECTION_STRING}
      MongoDb__DatabaseName: ${MONGODB_DATABASE_NAME-OrdersDb}
      BasketApi__BaseUrl: http://basket.api:8080
    ports:
      - "8082:8080"
    depends_on:
      - basket.api